[workspace]
resolver = "3"
members = ["daftar_core", "daftar_cli", "daftar_bridge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Proprietary"

[workspace.dependencies]
daftar_core = { path = "daftar_core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "3", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-platform", "tzdb-concatenated"] }
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
ssh-key = { version = "0.6", features = ["ed25519", "getrandom", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde-saphyr = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "http2", "multipart", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-root-certs = "1"
futures = "0.3"
sha2 = "0.11"
base64 = "0.23"
async-trait = "0.1"
unicode-normalization = "0.1"
rmcp = { version = "3.4.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider", "auth", "base64"] }
url = "2"
http = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
