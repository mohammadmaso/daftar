name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.1
  FRB_VERSION: 2.13.0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core, cache-bin: true }
      - name: Bindings are up to date
        run: |
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked
          cd app && flutter pub get && flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust ../core/daftar_bridge/src
      - working-directory: app
        run: flutter analyze --fatal-infos
      - working-directory: app
        run: flutter test
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: golden-failures, path: app/test/**/failures/ }

  build:
    needs: [rust, flutter]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest, cmd: "flutter build linux --release" }
          - { target: android, os: ubuntu-latest, cmd: "flutter build apk --release" }
          - { target: windows, os: windows-latest, cmd: "flutter build windows --release" }
          - { target: macos, os: macos-latest, cmd: "flutter build macos --release" }
          - { target: ios, os: macos-latest, cmd: "flutter build ios --release --no-codesign" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - if: matrix.target == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - if: matrix.target == 'ios'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - if: matrix.target == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - working-directory: app
        run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v7
        with:
          name: daftar-${{ matrix.target }}
          path: |
            app/build/linux/x64/release/bundle
            app/build/app/outputs/flutter-apk/*.apk
            app/build/windows/x64/runner/Release
            app/build/macos/Build/Products/Release/*.app
            app/build/ios/iphoneos/*.app
          if-no-files-found: ignore
